<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relaxation Game 🐶☀️</title>

<style>
body {
  margin: 0;
  background: linear-gradient(to bottom, #a0e9ff, #e9faff);
  font-family: "Poppins", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  position: relative;
}

canvas {
  border: 2px solid #3b9dfc;
  border-radius: 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}

#scoreBoard {
  position: absolute;
  top: 15px;
  left: 20px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 16px;
}

#returnBtn {
  display: none;
  position: absolute;
  top: 15px;
  right: 20px;
  background: linear-gradient(135deg, #3b9dfc, #1e7adc);
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="scoreBoard">🏅 Score: 0</div>
<button id="returnBtn">⟲ Return</button>
<canvas id="game_screen" width="400" height="550"></canvas>

<script>
window.parent.postMessage({ type: "game_started" }, "*");

const canvas = document.getElementById("game_screen");
const ctx = canvas.getContext("2d");
const scoreBoard = document.getElementById("scoreBoard");
const returnBtn = document.getElementById("returnBtn");

let score = 0;
let gameRunning = true;
let objects = [];
let keys = {};

const player = {
  x: canvas.width / 2 - 25,
  y: canvas.height - 60,
  width: 50,
  height: 50,
  speed: 6
};

// Focus canvas for keyboard
canvas.tabIndex = 0;
canvas.focus();

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function spawnObject() {
  objects.push({
    x: Math.random() * (canvas.width - 30),
    y: -30,
    size: 30,
    speed: 2 + Math.random() * 2
  });
}

function update() {
  if (!gameRunning) return;

  // Player movement
  if (keys["ArrowLeft"] && player.x > 0)
    player.x -= player.speed;

  if (keys["ArrowRight"] && player.x < canvas.width - player.width)
    player.x += player.speed;

  // Update falling objects
  objects.forEach(obj => obj.y += obj.speed);

  // Collision detection
  objects = objects.filter(obj => {
    if (
      obj.x < player.x + player.width &&
      obj.x + obj.size > player.x &&
      obj.y < player.y + player.height &&
      obj.y + obj.size > player.y
    ) {
      score++;
      scoreBoard.innerText = "🏅 Score: " + score;
      return false;
    }
    return obj.y < canvas.height;
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw player (dog emoji)
  ctx.font = "40px Arial";
  ctx.fillText("🐶", player.x, player.y + 40);

  // Draw falling objects (sun emoji)
  objects.forEach(obj => {
    ctx.font = "30px Arial";
    ctx.fillText("☀️", obj.x, obj.y + 30);
  });
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// Spawn objects every second
setInterval(() => {
  if (gameRunning) spawnObject();
}, 1000);

// End game after 30 seconds
setTimeout(() => {
  gameRunning = false;
  returnBtn.style.display = "block";
}, 30000);

returnBtn.addEventListener("click", () => {
  window.parent.postMessage(
    { type: "game_finished", game: "relaxation", score: score },
    "*"
  );
});

gameLoop();
</script>

</body>
</html>
