<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeuroDiverse – Register</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f3ff, #ffffff);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .card {
      width: 380px;
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 25px 50px rgba(76, 29, 149, 0.15);
    }

    h2 {
      text-align: center;
      color: #4c1d95;
      margin-bottom: 20px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1.5px solid #ddd;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #6d28d9, #8b5cf6);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .note {
      margin-top: 14px;
      text-align: center;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>🧠 Create Account</h2>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <input type="text" name="username" placeholder="Username" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>

      <button type="submit">Register</button>
    </form>

    <div class="note">
      Already registered? <a href="{{ url_for('auth.login') }}">Login</a>
    </div>
  </div>

</body>
</html>
