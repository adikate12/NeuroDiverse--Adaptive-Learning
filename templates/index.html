<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adaptive Study - 8th Grade Science</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body onload="startCamera()">

<div class="container">
    <!-- Left Panel -->
    <div class="left-panel">
        <h2>{{ main_video.title }}</h2>
        <iframe width="100%" height="400"
                src="{{ main_video.url.replace('watch?v=', 'embed/') }}"
                frameborder="0" allowfullscreen></iframe>

        <div class="desc">
            <h3>Description:</h3>
            <p>{{ main_video.description }}</p>
        </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
        <h2>8th Grade Lessons</h2>
        <div class="lesson-list">
            {% for lesson in lessons %}
                <div class="lesson-card">
                    <a href="{{ lesson.url }}" target="_blank">
                        <b>{{ lesson.title }}</b>
                    </a>
                    <p>{{ lesson.description }}</p>
                </div>
            {% endfor %}
        </div>
    </div>
</div>

<!-- Floating Camera Box -->
<div class="camera-box">
    <h3>🧠 Attention Monitor</h3>
    <img id="camFeed" src="{{ url_for('video_feed') }}" alt="Camera Feed" width="300" height="200"
         style="border-radius: 8px; border: 1px solid #ccc;">
    <div id="alertBox">Checking...</div>
</div>

<!-- Popup -->
<div class="popup" id="popup">
    <div class="popup-content">
        <h2>⚠️ You seem distracted!</h2>
        <p>Please refocus on your lesson.</p>
    </div>
</div>

<script>
    // Start camera feed
    function startCamera() {
        document.getElementById("camFeed").src = "/video_feed";
    }

    // Show popup
    function showPopup() {
        const popup = document.getElementById("popup");
        popup.style.display = "flex";
        setTimeout(() => popup.style.display = "none", 4000);
    }

    // Update attention status
    async function checkDistraction() {
        try {
            const response = await fetch('/check_distraction');
            const data = await response.json();
            const alertBox = document.getElementById("alertBox");

            if (data.distracted) {
                // Show red text + popup
                alertBox.textContent = "Distracted ⚠️";
                alertBox.classList.add("distracted");
                showPopup();
            } else {
                // Show green text
                alertBox.textContent = "Focused ✅";
                alertBox.classList.remove("distracted");
            }
        } catch (error) {
            console.error("Error checking distraction:", error);
        }
    }

    // Periodically update every 2 seconds
    setInterval(checkDistraction, 2000);
</script>

</body>
</html>
