<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeuroDiverse – Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background: white;
      width: 380px;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-size: 52px;
      margin-bottom: 10px;
    }

    h2 {
      color: #667eea;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #718096;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e0;
      font-size: 14px;
      transition: 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .btn-login {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      margin-top: 5px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102,126,234,0.4);
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #718096;
    }

    .note a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .note a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="logo">🧠✨</div>
    <h2>Welcome Back</h2>
    <div class="subtitle">Let’s continue learning — at your pace</div>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <!-- KEEPING YOUR ORIGINAL MONGO-CONNECTED INPUT NAMES -->
    <form method="POST">
      <input type="text" name="username" placeholder="👤 Username" required>
      <input type="password" name="password" placeholder="🔑 Password" required>

      <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="note">
      New user? <a href="{{ url_for('auth.register') }}">Create account</a>
    </div>
  </div>

</body>
</html>
